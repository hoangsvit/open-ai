name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install including optional Textual
        run: python -m pip install -e ".[tui]"
      - name: Compile Python files
        run: python -m compileall -q src tests
      - name: Unit tests (offline / mock ADB)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: CLI smoke
        run: |
          python -m open_ai_inspector promos
          python -m open_ai_inspector subscriptions --platform google
          python -c "from open_ai_inspector.tui import InspectorApp; print(InspectorApp.TITLE)"
